        description: "Public holidays per region, read from the Google Sheets input spreadsheet."
      - name: raw_team_splits
        description: "Per-sprint, per-member board/sub-team allocation, read from the Google Sheets input spreadsheet."
      - name: raw_sprint_planning
        description: "Per-sprint issue planning data, read from the Sprint Items Google Sheets tab."
