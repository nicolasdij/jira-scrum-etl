version: 2

sources:
  - name: raw
    schema: raw
    description: "Raw tables written by Dagster Python extraction assets."
    tables:
      - name: raw_jira_sprints
        description: "All sprints for DELI and NFR boards, extracted from the Jira Agile API."
      - name: raw_jira_issues
        description: "All issues for each sprint partition, extracted from the Jira Agile API."
      - name: raw_time_off
        description: "Time-off periods per team member, read from the Google Sheets input spreadsheet."
